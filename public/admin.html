<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الأدمن — Wafa</title>
  <link rel="stylesheet" href="/admin.css" />
  <script src="/src/theme.js"></script>
</head>
<body>
  <div id="admin-root" class="admin-wrap">
    <header class="admin-header">
      <h1>لوحة إدارة المستخدمين</h1>
      <a href="/index.html" class="admin-back-link">→ الرجوع للتطبيق الرئيسي</a>
    </header>

    <div id="admin-gate" class="admin-gate">جارِ التحقق من الجلسة…</div>

    <div id="admin-content" class="admin-content" hidden>
      <section class="admin-card">
        <h2>إضافة مستخدم جديد</h2>
        <form id="add-user-form" class="add-user-form">
          <input type="text" id="new-login" placeholder="login (اسم المستخدم في Odoo)" required autocomplete="off" />
          <select id="new-role">
            <option value="viewer" selected>viewer</option>
            <option value="editor">editor</option>
            <option value="admin">admin</option>
          </select>
          <input type="text" id="new-note" placeholder="ملاحظة (اختياري)" autocomplete="off" />
          <button type="submit">إضافة</button>
        </form>
      </section>

      <section class="admin-card">
        <h2>المستخدمون المصرَّح لهم</h2>
        <div id="admin-msg" class="admin-msg" hidden></div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>login</th>
              <th>الدور</th>
              <th>مفعّل</th>
              <th>ملاحظة</th>
              <th>المصدر</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="6" class="admin-loading">جارِ التحميل…</td></tr>
          </tbody>
        </table>
        <p class="admin-hint">اضغط "تفاصيل الصلاحيات ▾" في صف أي مستخدم لتخصيص صلاحياته الفردية فوق افتراضي دوره.</p>
      </section>
    </div>
  </div>

  <script src="/src/admin.js"></script>
</body>
</html>
